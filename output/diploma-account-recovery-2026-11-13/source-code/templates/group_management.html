{% if user.role=='RAG_ADMIN' %}
<section class="card"><details><summary>Создать группу документов</summary>
<form method="post" action="{{ url_for('create_group') }}">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label>Название группы<input name="name" required maxlength="100" placeholder="Например: Управление оплатой труда"></label>
<button>Создать группу</button>
</form></details></section>
{% endif %}
