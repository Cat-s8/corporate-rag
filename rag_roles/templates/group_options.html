<option value="">{{ group_empty_label|default('Все группы') }}</option>
{% if group_empty_label is not defined %}<option value="ungrouped" {% if selected_group=='ungrouped' %}selected{% endif %}>Без группы</option>{% endif %}
{% for group in groups %}<option value="{{ group.id }}" {% if selected_group|string==group.id|string %}selected{% endif %}>{{ group.name }}</option>{% endfor %}
